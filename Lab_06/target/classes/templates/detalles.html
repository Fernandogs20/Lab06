<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Detalle del Post</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2 th:text="${post.titulo}">Título del Post</h2>
    <p><strong>Autor:</strong> <span th:text="${post.autor}">Autor</span></p>
    <p><strong>Categoría:</strong> <span th:text="${post.categoria}">Categoría</span></p>
    <hr>
    <p th:text="${post.contenido}">Contenido completo aquí...</p>

    <div class="mt-4">
        <a th:href="@{/editar/{id}(id=${post.id})}" class="btn btn-warning">Editar</a>
        <a th:href="@{/lista}" class="btn btn-secondary">Volver</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
